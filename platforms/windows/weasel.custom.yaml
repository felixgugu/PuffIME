# Weasel UI style for PuffIME
#
# 15 color schemes (Weasel uses 0xBBGGRR, i.e. BGR, not RGB):
#   puff                 Puff 淺
#   puff_dark            Puff 深
#   puff_gray            Puff 灰
#   puff_macaron         Puff 馬卡龍
#   puff_mediterranean   Puff 地中海
#   puff_amber_dark      Puff 琥珀深
#   puff_cherry          Puff 櫻桃
#   puff_forest_dark     Puff 森林深
#   puff_ink_dark        Puff 墨黑高對比
#   puff_lavender        Puff 薰衣草
#   puff_mint            Puff 薄荷
#   puff_morandi_blue    Puff 莫蘭迪藍
#   puff_morandi_tea     Puff 莫蘭迪茶棕
#   puff_ocean           Puff 海洋
#   puff_sakura          Puff 櫻
#
# Switch with:  powershell -ExecutionPolicy Bypass -File tools\theme.ps1 -Name dark
# List all:     powershell -ExecutionPolicy Bypass -File tools\theme.ps1 -List
# or edit style/color_scheme below.
#
# Common UI: Microsoft JhengHei, single-row candidates, rounded corners,
# visible border.
patch:
  style:
    color_scheme: puff
    font_face: "Microsoft JhengHei"
    font_point: 14
    label_font_face: "Microsoft JhengHei"
    label_font_point: 12
    comment_font_face: "Microsoft JhengHei"
    comment_font_point: 10
    horizontal: true
    inline_preedit: true
    hover_type: none
    layout:
      max_width: 0 # 0 = single row (no wrapping)
      min_width: 0
      margin_x: 12
      margin_y: 10
      spacing: 10
      candidate_spacing: 8
      hilite_spacing: 4
      hilite_padding: 3
      border_width: 2
      corner_radius: 8
      round_corner: 8
      shadow_radius: 4
      shadow_offset_x: 0
      shadow_offset_y: 3
      linespacing: 0
      baseline: 0

  preset_color_schemes:
    puff:
      {
        author: PuffIME,
        back_color: 0xFAFAFA,
        border_color: 0xD0D0D0,
        candidate_text_color: 0x333333,
        comment_text_color: 0x888888,
        hilited_back_color: 0xFEF0E8,
        hilited_candidate_back_color: 0xFDF2E3,
        hilited_candidate_text_color: 0xA1470D,
        hilited_comment_text_color: 0x666666,
        hilited_label_color: 0x666666,
        hilited_text_color: 0x111111,
        label_color: 0x888888,
        name: "Puff 淺",
        shadow_color: 0x22000000,
        text_color: 0x222222,
      }
